.m8-smart-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:16px 0}.m8-smart{border-radius:20px;padding:15px 12px;text-align:center;border:3px solid rgba(46,74,93,.12);background:#fff7e9;min-height:175px}.m8-smart:nth-child(2){background:#eef5f4}.m8-smart:nth-child(3){background:#fff3e7}.m8-smart:nth-child(4){background:#f3f1e8}.m8-smart:nth-child(5){background:#eef2f7}.m8-smart b{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;margin:0 auto 8px;background:var(--navy);color:white;font-size:21px}.m8-smart strong{display:block;font-size:15px;margin-bottom:6px}.m8-smart span{display:block;font-size:11px;line-height:1.35;color:#55768c;font-weight:700}

.m8-role-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;margin:15px 0}.m8-role{padding:14px 10px;border-radius:17px;text-align:center;border:2px solid rgba(46,74,93,.12);background:#fff7e9}.m8-role:nth-child(even){background:#eef5f4}.m8-role:nth-child(3){background:#fff3e7}.m8-role span{font-size:28px;display:block;margin-bottom:5px}.m8-role strong{display:block;font-size:13px}.m8-role small{display:block;font-size:11px;line-height:1.35;color:#55768c;margin-top:4px;font-weight:700}

@media(max-width:1050px){.m8-component-grid,.m8-goal-card-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.m8-smart-grid,.m8-why-grid,.m8-role-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

<body>
<a class="sr-only" href="#mainContent">Skip to course content</a>
<div class="app" id="app">
<header class="hud hidden" id="courseHud" aria-label="Course menu"><button class="menu-toggle" id="menuToggle" type="button" aria-expanded="false">Menu ▾</button><div class="menu hidden" id="sceneMenu" aria-hidden="true"></div></header>
<main id="mainContent"></main>
<div class="modal-backdrop hidden" id="modalBackdrop" role="dialog" aria-modal="true" aria-hidden="true"><div class="modal" id="modalPanel"><button class="close-btn" id="closeModal" aria-label="Close dialog">×</button><div id="modalContent"></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div><div class="sr-only" id="srStatus" aria-live="polite"></div>
</div>
<script>(() => {
'use strict';
const IMG={
 exterior:'https://cestuve.github.io/module1/BG-01.png',
 finalExterior:'https://cestuve.github.io/module1/BG-08.png',
 office:'https://cestuve.github.io/module2/Maria_Office.png',
 conference:'https://cestuve.github.io/module4/Case_Conference_Room.png',
 mariaFull:'https://cestuve.github.io/module8/Maria_Fullbody.png',
 mariaHead:'https://cestuve.github.io/module8/Maria_Headshot.png',
 devonFull:'https://cestuve.github.io/module6/Devon_Fullbody.png',
 devonHead:'https://cestuve.github.io/module6/Devon_Headshot.png',
 elenaFull:'https://cestuve.github.io/module8/Elena_Fullbody.png',
 elenaHead:'https://cestuve.github.io/module8/Elena_Headshot.png',
 tasha:'https://cestuve.github.io/module6/Tasha_Headshot.png',
 sofia:'https://cestuve.github.io/module6/Sofia_Headshot.png',
 aaron:'https://cestuve.github.io/module6/Aaron_Headshot.png',
 clientHead:'https://cestuve.github.io/Module7/Client_Headshot.png',
 treatment:'https://cestuve.github.io/module6/Treatment_Planning_Room.png',
 resource:'https://cestuve.github.io/module6/Assessment_Resource_Room.png',
 intake:'https://cestuve.github.io/module6/Intake_Interview_Room.png'
};
const sections=[
 ['Week 8','Turn the plan into measurable action'],
 ['Treatment Plan Anatomy','Problems, goals, objectives, interventions'],
 ['Devon’s Plan','Put the pieces together'],
 ['SMART Objectives','Make progress observable'],
 ['SMART Goal Lab','Test and improve objectives'],
 ['Client Involvement','Build goals with the client'],
 ['Progress & Review','Track barriers and adjust'],
 ['CDCA Role','Support implementation within scope'],
 ['Why Planning Matters','Clinical, legal, and team value'],
 ['Complete','Download your reflection PDF']
];
const state={maxSection:0,reflections:{planning:'',smart:'',voice:'',progress:''}};
const main=document.getElementById('mainContent'),hud=document.getElementById('courseHud'),menu=document.getElementById('sceneMenu'),menuToggle=document.getElementById('menuToggle'),modalBackdrop=document.getElementById('modalBackdrop'),modalContent=document.getElementById('modalContent'),closeModalBtn=document.getElementById('closeModal'),toast=document.getElementById('toast'),srStatus=document.getElementById('srStatus');
function esc(v){return String(v??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}
function say(t){srStatus.textContent='';setTimeout(()=>srStatus.textContent=t,20)}
function showToast(t){toast.textContent=t;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),2300)}
function showModal(html){modalContent.innerHTML=html;modalBackdrop.classList.remove('hidden');modalBackdrop.setAttribute('aria-hidden','false');const h=modalContent.querySelector('h2');if(h){h.id='modalTitle';modalBackdrop.setAttribute('aria-labelledby','modalTitle')}setTimeout(()=>{const f=modalContent.querySelector('button,select,textarea,input,a');if(f)f.focus()},20)}
function closeModal(){modalBackdrop.classList.add('hidden');modalBackdrop.setAttribute('aria-hidden','true')}
function headQuote(img,name,text){return `<div class="quote-card quote-with-headshot"><img src="${img}" alt="${esc(name)}"><div><strong>${esc(name)}</strong><p>${text}</p></div></div>`}
function setSection(i){state.maxSection=Math.max(state.maxSection,i);renderMenu()}
function renderMenu(){menu.innerHTML=sections.map((s,i)=>`<button class="menu-item" type="button" data-jump="${i}" ${i>state.maxSection?'disabled':''}>${i+1}. ${s[0]}<span>${s[1]}</span></button>`).join('')}
function choiceMarkup(action,opts){return `<div class="question-block"><div class="choices">${opts.map((o,i)=>`<button class="choice-btn" type="button" data-action="${action}" data-v="${i}"><span class="choice-title">${String.fromCharCode(65+i)}.</span><span class="choice-text">${o}</span></button>`).join('')}</div><div class="inline-question-feedback" aria-live="polite"></div></div>`}
function markChoice(button,correct){const block=button.closest('.question-block');if(!block)return false;block.querySelectorAll('.choice-btn').forEach(x=>x.classList.remove('correct','incorrect','selected'));const v=Number(button.dataset.v);button.classList.add(v===correct?'correct':'incorrect');return v===correct}
function answerFeedback(button,ok,title,body,nextAction,nextLabel){const block=button.closest('.question-block');const container=block?.querySelector('.inline-question-feedback');if(!container)return;container.className='inline-question-feedback has-feedback '+(ok?'correct':'incorrect');container.innerHTML=`<strong>${title}</strong>${body}<div class="button-row"><button class="primary-btn" type="button" data-action="${nextAction}">${nextLabel}</button></div>`;say(`${title}. ${container.textContent||''}`)}
function checkFeedback(button,ok,title,body,nextAction,nextLabel){const block=button.closest('.check-question-block');const container=block?.querySelector('.inline-question-feedback');if(!container)return;container.className='inline-question-feedback has-feedback '+(ok?'correct':'incorrect');container.innerHTML=`<strong>${title}</strong>${body}<div class="button-row"><button class="primary-btn" type="button" data-action="${nextAction}">${nextLabel}</button></div>`;say(`${title}. ${container.textContent||''}`)}
function saveReflection(key,id,next){const el=document.getElementById(id),v=(el?.value||'').trim();if(v.length<20){showToast('Please write a little more before continuing.');el?.focus();return}state.reflections[key]=v;next()}

menuToggle.addEventListener('click',e=>{e.stopPropagation();const open=menu.classList.toggle('hidden')===false;menuToggle.setAttribute('aria-expanded',open?'true':'false');menu.setAttribute('aria-hidden',open?'false':'true')});
document.addEventListener('click',e=>{if(!e.target.closest('#courseHud')){menu.classList.add('hidden');menuToggle.setAttribute('aria-expanded','false');menu.setAttribute('aria-hidden','true')}});
closeModalBtn.addEventListener('click',closeModal);modalBackdrop.addEventListener('click',e=>{if(e.target===modalBackdrop)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modalBackdrop.classList.contains('hidden'))closeModal()});

function titleIntro(){hud.classList.add('hidden');main.innerHTML=`<section class="intro-scene"><div class="intro-panel"><span class="mini-label">Harbor Point · Module 8</span><h1>Treatment Planning, Part 2</h1><div class="intro-rule"></div><p class="intro-lead">A treatment plan turns assessment information and treatment decisions into a written roadmap that the client and treatment team can actually use.</p><p class="intro-copy">This week, you’ll return to Harbor Point to help translate client needs into problem statements, broad goals, measurable objectives, interventions, and review time frames.</p><p class="intro-copy">You’ll also practice SMART goal writing, client involvement, progress monitoring, and the CDCA’s role in supporting treatment-plan implementation without independently creating or changing the plan.</p><div class="button-row"><button class="primary-btn" data-action="go-exterior">Return to Harbor Point →</button></div></div></section>`}
function exterior(){hud.classList.remove('hidden');setSection(0);main.innerHTML=`<section class="scene"><div class="environment" style="background-image:url('${IMG.exterior}')"><div class="scene-title-card" style="top:110px;left:7%;text-align:left"><span class="mini-label">Week 8 · Back at Harbor Point</span><h1>Harbor Point Recovery Services</h1><p>Maria has asked you to join a treatment-plan review meeting this morning.</p></div><button class="hotspot" type="button" aria-label="Enter Harbor Point" data-action="office-scene" style="left:52%;top:34%;width:18%;height:36%"></button></div></section>`}
function officeScene(){setSection(0);main.innerHTML=`<section class="scene"><div class="environment" style="background-image:url('${IMG.office}')"><div class="scene-guide">Meet with Maria before the treatment-plan review.</div><img class="character" src="${IMG.mariaFull}" alt="" style="left:50%;transform:translateX(-50%);bottom:-2%;height:70vh"><button class="character-hotspot" data-action="maria-week8" type="button" aria-label="Talk with Maria about Week 8" style="left:50%;transform:translateX(-50%);bottom:2%;width:28%;height:64%"></button></div></section>`}
function mariaWeek8(){showModal(`<h2>From Treatment Decisions to a Written Plan</h2>${headQuote(IMG.mariaHead,'Maria','“Last week, you looked at what treatment might fit a client. This week, we need to make that plan clear enough that the client and every member of the team know what we are working toward.”')}<p>A treatment plan is a <strong>written, individualized roadmap</strong>. It organizes the client’s problems or needs, goals, measurable objectives, treatment-team interventions, and time frames for review.</p><p>As a CDCA, you may gather information, help clients identify goals, support follow-through, document progress or barriers, and communicate observations. You <strong>support implementation</strong>, but you do not create or modify the treatment plan independently.</p><div class="button-row center"><button class="primary-btn" data-action="anatomy-scene">Open the Treatment Plan →</button></div>`) }

function anatomyScene(){closeModal();setSection(1);main.innerHTML=`<section class="scene"><div class="environment" style="background-image:url('${IMG.treatment}')"><div class="scene-guide">Maria is reviewing the six pieces that make a treatment plan usable.</div><img class="character" src="${IMG.mariaFull}" alt="" style="right:8%;bottom:-3%;height:66vh"><button class="character-hotspot" data-action="anatomy-open" type="button" aria-label="Review treatment-plan components" style="right:8%;bottom:2%;width:27%;height:61%"></button></div></section>`}
function anatomyOpen(){showModal(`<h2>What Belongs in a Treatment Plan?</h2><div class="m8-component-grid"><div class="m8-component"><span class="m8-icon">🔎</span><strong>Problem Statement</strong><span>Describes the client problem or need identified through assessment.</span></div><div class="m8-component"><span class="m8-icon">🎯</span><strong>Goal</strong><span>States the broad outcome the client is working toward.</span></div><div class="m8-component"><span class="m8-icon">✅</span><strong>Objectives</strong><span>Break the goal into specific, measurable steps.</span></div><div class="m8-component"><span class="m8-icon">🧰</span><strong>Interventions</strong><span>Describe what the counselor or treatment team will do to support progress.</span></div><div class="m8-component"><span class="m8-icon">📅</span><strong>Time Frames</strong><span>Identify when progress or an objective will be reviewed.</span></div><div class="m8-component"><span class="m8-icon">🤝</span><strong>Client Involvement</strong><span>Develop the plan with the client to support engagement and accountability.</span></div></div><h3>Quick Check</h3><p>Which part of the treatment plan answers, <strong>“What specific step will show that the client is moving toward the goal?”</strong></p>${choiceMarkup('anatomy-choice',['Problem statement','Intervention','Objective','Time frame'])}`)}

function devonScene(){closeModal();setSection(2);main.innerHTML=`<section class="scene"><div class="environment" style="background-image:url('${IMG.conference}')"><div class="scene-guide">Use Devon’s information to distinguish the parts of a treatment plan.</div><img class="character" src="${IMG.devonFull}" alt="" style="left:25%;bottom:-2%;height:66vh"><img class="character" src="${IMG.mariaFull}" alt="" style="right:20%;bottom:-3%;height:64vh"><button class="character-hotspot" data-action="devon-plan" type="button" aria-label="Review Devon's written treatment plan" style="left:25%;bottom:2%;width:25%;height:60%"></button></div></section>`}
const devonPieces=[
 ['Review progress in four weeks.','timeframe'],
 ['Alcohol use is contributing to missed work and relationship conflict.','problem'],
 ['Provide relapse-prevention education and support practice of coping skills.','intervention'],
 ['Improve recovery stability and functioning.','goal'],
 ['Attend three outpatient group therapy sessions per week for the next four weeks.','objective']
];
const componentLabels={problem:'Problem statement',goal:'Goal',objective:'Objective',intervention:'Intervention',timeframe:'Time frame'};
function refreshDevonBoard(){
 const selected=modalContent.dataset.devonSelected||'';
 const targets=[...modalContent.querySelectorAll('.m8-target-card')];
 const assigned={};
 targets.forEach(t=>{
  const idx=t.dataset.assignedIndex||'';
  t.classList.remove('answer-correct','answer-incorrect');
  t.classList.toggle('filled',idx!=='' );
  const assignment=t.querySelector('.target-assignment');
  if(assignment) assignment.textContent=idx!==''?devonPieces[Number(idx)][0]:'No statement matched yet.';
  if(idx!=='') assigned[idx]=t.dataset.slot;
 });
 modalContent.querySelectorAll('.devon-card').forEach(card=>{
  const idx=card.dataset.idx;
  card.classList.toggle('selected',idx===selected);
  card.classList.toggle('placed',Boolean(assigned[idx]));
